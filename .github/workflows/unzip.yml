name: Unzip project

on:
  push:
    paths:
      - 'waleedmmh.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract zip to repo root
        run: |
          if [ ! -f waleedmmh.zip ]; then echo "no zip found, nothing to do"; exit 0; fi
          unzip -o waleedmmh.zip -d _tmp
          cp -a _tmp/waleedmmh/. .
          rm -rf _tmp waleedmmh.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract project from waleedmmh.zip" || echo "nothing to commit"
          git push
